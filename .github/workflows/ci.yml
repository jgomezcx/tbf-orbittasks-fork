# OrbitTasks CI — Baseline workflow.
#
# NOTE for fellows:
# This workflow is DELIBERATELY slow. It is what OrbitTasks would have
# inherited if the engineering team had set up CI three years ago and
# never revisited it. Workshop 3 students improve this file in place,
# one optimization at a time, with the recipe in
# workshops/03-cicd/optimization-recipe.md.
#
# What's slow on purpose, in this file specifically:
#   - No dependency caching (no `cache: npm`).
#   - No matrix strategy (api and web run sequentially in one job).
#   - No sharding (test files run one after another).
#   - No incremental TypeScript build (tsconfig also enforces this).
#   - Coverage is collected on every PR (jest.config.js enforces this).
#   - Deploy script copies files one at a time (scripts/deploy.sh).
#
# Each of those is fixed by a corresponding step in the recipe doc.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:

  install:
    name: Install
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    needs: install

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck


  test-api:
    name: Test API (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest

    needs: lint-and-typecheck

    strategy:
      fail-fast: false

      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run API Tests
        run: |
          npm test --workspace=apps/api -- \
            --shard=${{ matrix.shard }}/2

  test-web:
    name: Test Web
    runs-on: ubuntu-latest

    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Run Web Tests
        run: npm test --workspace=apps/web

  build:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest

    needs:
      - test-api
      - test-web

    strategy:
      matrix:
        app:
          - api
          - web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build --workspace=apps/${{ matrix.app }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Deploy
        run: npm run deploy

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: apps/api/coverage
          retention-days: 7



